workflows:
  ios-unsigned:
    name: iOS Unsigned IPA (for Sideloadly)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build unsigned IPA
        script: flutter build ipa --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
